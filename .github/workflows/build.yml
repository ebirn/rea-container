name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ebirn/rea-container

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          podman build -f Containerfile -t rea-sandbox \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} .
      - name: Tool versions
        run: |
          podman run --rm --entrypoint sh rea-sandbox -c '
            /opt/binwalk/bin/binwalk --version; /opt/venv-unblob/bin/unblob --version
            tshark --version | head -1; sigrok-cli --version | head -1; apktool --version
            wakaru --version; kuna --version; rizin -v | head -1; mitmdump --version | head -1
            /opt/ilspycmd/ilspycmd --version | head -1; wasm2wat --version; adb version | head -1
            objdump --version | head -1; gdb --version | head -1; chromium-container --version
            /opt/venv-pwn/bin/pip list 2>/dev/null | grep -iE "pwntools|pyelftools|unicorn"'
      - name: REA doctor in hardened container
        run: |
          mkdir -p samples out
          # doctor exits non-zero while Hopper/IDA/agent registrations are absent (expected)
          ./run.sh doctor --json > doctor.json || true
          python3 -I - <<'PY'
          import json, sys
          d = json.load(open("doctor.json"))
          checks = {c["name"]: c for c in d["scope_checks"]}
          required = ["ghidra-version", "ghidra-native_decompiler", "ghidra-java", "jadx",
                      "kuna-installation", "kuna-cache", "ilspycmd"]
          bad = [n for n in required if not checks.get(n, {}).get("ok")]
          for n in required:
              print("ok  " if n not in bad else "FAIL", n)
          sys.exit(1 if bad else 0)
          PY
      - name: MCP self-check
        run: |
          ./run.sh mcp doctor --json | tee mcp-doctor.json
          grep -q '"healthy": true' mcp-doctor.json
      - name: Push image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman tag rea-sandbox "$IMAGE:${{ github.sha }}-${{ matrix.arch }}"
          podman push "$IMAGE:${{ github.sha }}-${{ matrix.arch }}"

  manifest:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Publish multi-arch tag
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman manifest create rea
          podman manifest add rea "docker://$IMAGE:${{ github.sha }}-amd64"
          podman manifest add rea "docker://$IMAGE:${{ github.sha }}-arm64"
          podman manifest push --all rea "docker://$IMAGE:latest"
          podman manifest push --all rea "docker://$IMAGE:${{ github.sha }}"
