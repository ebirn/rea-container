name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ebirn/rea-container

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Release tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for f in plugins/rea-container/plugin.json plugins/rea-container/.claude-plugin/plugin.json; do
            v=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' "$f")
            [ "v$v" = "${{ github.ref_name }}" ] || { echo "$f has version $v, tag is ${{ github.ref_name }}"; exit 1; }
          done
      - name: Build image
        run: |
          podman build -f Containerfile -t rea-sandbox \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} .
      - name: Tool versions
        run: |
          podman run --rm --entrypoint sh rea-sandbox -c '
            /opt/binwalk/bin/binwalk --version; /opt/venv-unblob/bin/unblob --version
            tshark --version | head -1; sigrok-cli --version | head -1; apktool --version
            wakaru --version; kuna --version; rizin -v | head -1; mitmdump --version | head -1
            /opt/ilspycmd/ilspycmd --version | head -1; wasm2wat --version; adb version | head -1
            objdump --version | head -1; gdb --version | head -1; chromium-container --version
            /opt/venv-pwn/bin/pip list 2>/dev/null | grep -iE "pwntools|pyelftools|unicorn"'
      - name: REA doctor in hardened container
        run: |
          mkdir -p samples out
          # doctor exits non-zero while Hopper/IDA/agent registrations are absent (expected)
          ./run.sh doctor --json > doctor.json || true
          python3 -I - <<'PY'
          import json, sys
          d = json.load(open("doctor.json"))
          checks = {c["name"]: c for c in d["scope_checks"]}
          required = ["ghidra-version", "ghidra-native_decompiler", "ghidra-java", "jadx",
                      "kuna-installation", "kuna-cache", "ilspycmd"]
          bad = [n for n in required if not checks.get(n, {}).get("ok")]
          for n in required:
              print("ok  " if n not in bad else "FAIL", n)
          sys.exit(1 if bad else 0)
          PY
      - name: MCP self-check
        run: |
          ./run.sh mcp doctor --json | tee mcp-doctor.json
          python3 -I -c 'import json, sys; sys.exit(0 if json.load(open("mcp-doctor.json"))["healthy"] is True else 1)'
      - name: Push image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman tag rea-sandbox "$IMAGE:${{ github.sha }}-${{ matrix.arch }}"
          podman push "$IMAGE:${{ github.sha }}-${{ matrix.arch }}"

  manifest:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Publish multi-arch tags
        run: |
          # main: :main and :<sha>. Release tag vX.Y.Z: :vX.Y.Z and :latest, so :latest
          # (what the plugin runs) only ever points at a release.
          if [ "${{ github.ref_type }}" = tag ]; then tags="${{ github.ref_name }} latest"; else tags="main ${{ github.sha }}"; fi
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman manifest create rea
          podman manifest add rea "docker://$IMAGE:${{ github.sha }}-amd64"
          podman manifest add rea "docker://$IMAGE:${{ github.sha }}-arm64"
          for t in $tags; do podman manifest push --all rea "docker://$IMAGE:$t"; done
